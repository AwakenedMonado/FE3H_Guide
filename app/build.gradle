apply plugin: 'com.android.application'

android {
    namespace "com.xiana.fe3hguide"
    compileSdk 34

    defaultConfig {
        applicationId "com.xiana.fe3hguide"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        quiet true
        abortOnError false
        ignoreWarnings true
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.github.michaelprimez:searchablespinner:1.0.9'
    implementation 'com.github.amulyakhare:TextDrawable:558677ea31'
    implementation 'com.github.michaelprimez:revealedittext:1068d8c165'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'

    implementation 'info.hoang8f:fbutton:1.0.5'
    implementation 'com.jjoe64:graphview:4.2.2'
    implementation 'com.github.DevLight-Mobile-Agency:NavigationTabBar:1.2.5'
}
